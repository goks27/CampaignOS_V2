[project]
name = "campaignos-local-ai-worker"
version = "0.1.0"
description = "CampaignOS local AI worker: polls Supabase for review jobs and runs them on a local Ollama model."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 4 browser testing. After installing: python -m playwright install chromium
browser = ["playwright>=1.47"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "SIM105", "SIM108", "RUF059", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.jobs.development", "app.browser"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ollama: needs a running Ollama with the configured model (skipped otherwise)",
  "db: needs DATABASE_URL pointing at a migrated CampaignOS database (skipped otherwise)",
  "browser: needs Playwright + Chromium (skipped otherwise)",
]
